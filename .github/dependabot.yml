version: 2
updates:
  # npm dependencies: one weekly PR for minor and patch bumps, majors come as
  # separate PRs.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - '*'
        update-types: ['minor', 'patch']
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'
